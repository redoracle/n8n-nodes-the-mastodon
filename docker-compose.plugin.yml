services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PLUGIN_TARBALL: ${PLUGIN_TARBALL}
    image: n8n-dev-with-plugin
    environment:
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - N8N_LOG_LEVEL=debug
    ports:
      - '127.0.0.1:5678:5678'
