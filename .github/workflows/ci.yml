name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test --runInBand
      - run: pnpm build

  docker-smoke:
    name: docker image smoke build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build hardened n8n image
        run: docker build --pull --target final -f Dockerfile -t mastodon-n8n:ci .
      - name: Build developer image
        run: docker build --pull --target final -f Dockerfile.dev -t mastodon-n8n:dev-ci .
      - name: Verify unprivileged container users
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' mastodon-n8n:ci)" = node
          test "$(docker image inspect --format '{{.Config.User}}' mastodon-n8n:dev-ci)" = node

  release-integrity:
    name: inspect npm publication state
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compare latest Git release tag with public npm registry
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag --merged HEAD --sort=-version:refname | grep -Em1 '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -z "$latest_tag" ]; then
            echo "No release tag found on this revision" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          package="$(node -p 'require("./package.json").name')"
          version="${latest_tag#v}"
          url="https://registry.npmjs.org/${package}/${version}"
          status="$(curl --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 -o "$RUNNER_TEMP/npm-version.json" -w '%{http_code}' "$url")"
          case "$status" in
            200)
              jq -e --arg version "$version" '.version == $version' "$RUNNER_TEMP/npm-version.json" >/dev/null
              echo "Git tag ${latest_tag}: published package ${package}@${version} confirmed on npm" >> "$GITHUB_STEP_SUMMARY"
              ;;
            404)
              echo "::warning::Git tag ${latest_tag} is not published on npm. Release reconciliation required."
              echo "Git tag ${latest_tag}: **not present** on npm (HTTP 404). Investigate before another release." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unexpected npm registry HTTP status ${status} while checking ${package}@${version}"
              exit 1
              ;;
          esac
          for historical in 0.0.37 0.0.38 0.0.39; do
            historical_status="$(curl --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 -o "$RUNNER_TEMP/npm-historical-${historical}.json" -w '%{http_code}' "https://registry.npmjs.org/${package}/${historical}")"
            if [[ "$historical_status" != 200 && "$historical_status" != 404 ]]; then
              echo "::error::npm returned HTTP ${historical_status} for historical ${historical}"
              exit 1
            fi
            echo "Historical npm version ${package}@${historical}: HTTP ${historical_status}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
