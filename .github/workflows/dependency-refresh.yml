# One-shot maintenance workflow. Remove after reviewing the generated lockfile.
name: Audit dependency refresh
on:
  push:
    branches:
      - audit/secure-transport-ci-docs-2026-11
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'redoracle/n8n-nodes-the-mastodon'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install current frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Update in-range dependency resolutions
        run: pnpm update --lockfile-only
      - name: Validate fresh lockfile and source
        run: |
          pnpm install --frozen-lockfile
          pnpm verify
          pnpm audit --prod --audit-level=high
          git diff --check
      - name: Commit only verified pnpm dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh compatible dependencies after full CI verification"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
