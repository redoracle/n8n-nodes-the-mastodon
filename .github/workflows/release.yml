name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  # Trusted npm publishing uses short-lived GitHub OIDC credentials.
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test --runInBand
      - run: pnpm build
      - name: Verify npm CLI supports trusted publishing
        run: |
          npm --version
          node -e "const v=require('child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number);if(v[0]<11||(v[0]===11&&(v[1]<5||(v[1]===5&&v[2]<1)))){throw Error('npm >=11.5.1 is required for trusted publishing')}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "::error::GitHub OIDC environment is unavailable"; exit 1; }
      # Only this SHA-locked, unpublished 2026-11-06 release tag may be removed.
      - name: Reconcile verified orphaned v0.0.40 tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "redoracle/n8n-nodes-the-mastodon" ]] || exit 1
          tag="v0.0.40"
          expected_sha="439fb14eca735ab80d1c8e1225c378537ec4c1a7"
          actual_sha="$(git rev-list -n 1 "refs/tags/${tag}" 2>/dev/null || true)"
          if [[ -z "$actual_sha" || "$actual_sha" != "$expected_sha" ]]; then
            echo "No matching interrupted release tag to reconcile"
            exit 0
          fi
          package="$(node -p 'require("./package.json").name')"
          version="${tag#v}"
          npm_status="$(curl --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 -o "$RUNNER_TEMP/npm-recovery-version.json" -w '%{http_code}' "https://registry.npmjs.org/${package}/${version}")"
          if [[ "$npm_status" == 200 ]]; then
            echo "The version is already published on npm; preserving ${tag}"
            exit 0
          fi
          if [[ "$npm_status" != 404 ]]; then
            echo "::error::npm registry returned HTTP ${npm_status}; preserving every tag"
            exit 1
          fi
          release_status="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 -o "$RUNNER_TEMP/github-recovery-release.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          if [[ "$release_status" != 404 ]]; then
            echo "::error::GitHub Release status ${release_status} is not 404; preserving every tag"
            exit 1
          fi
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          if [[ "$remote_sha" != "$expected_sha" ]]; then
            echo "::error::Tag SHA changed; refusing to delete ${tag}"
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          git tag -d "$tag"
          echo "::notice::Removed verified orphaned ${tag}: npm 404; GitHub Release 404; tag SHA matched"
      - name: Check latest release-tag integrity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="$(git tag --merged HEAD --sort=-version:refname | grep -Em1 '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [[ -z "$latest_tag" ]]; then
            exit 0
          fi
          package="$(node -p 'require("./package.json").name')"
          version="${latest_tag#v}"
          npm_status="$(curl --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 -o "$RUNNER_TEMP/npm-latest-version.json" -w '%{http_code}' "https://registry.npmjs.org/${package}/${version}")"
          case "$npm_status" in
            200)
              jq -e --arg version "$version" '.version == $version' "$RUNNER_TEMP/npm-latest-version.json" >/dev/null
              ;;
            404)
              # Legacy GitHub-only releases are reported but are NOT confused with
              # uncompleted tags that have neither an npm version nor a GitHub Release.
              release_status="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 -o "$RUNNER_TEMP/github-latest-release.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${latest_tag}")"
              if [[ "$release_status" == 200 ]]; then
                echo "::warning::Historical GitHub Release ${latest_tag} exists but npm ${package}@${version} is missing. Preserve the release and reconcile npm separately."
              elif [[ "$release_status" == 404 ]]; then
                echo "::error::Orphaned Git tag ${latest_tag} has neither a published npm version nor a GitHub Release."
                exit 1
              else
                echo "::error::GitHub API returned HTTP ${release_status}; refusing to proceed."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected npm HTTP status ${npm_status}; refusing to proceed."
              exit 1
              ;;
          esac
      - name: Snapshot existing tags before semantic-release
        run: git tag --list | LC_ALL=C sort > "$RUNNER_TEMP/tags-before-release.txt"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
      # semantic-release pushes a Git tag before npm publish. On a failed run,
      # remove only newly created tags for this exact commit when neither npm
      # nor GitHub Releases has the version. Never modify pre-existing tags.
      - name: Reconcile only new tags from a failed publication
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/tags-before-release.txt" ]]; then
            echo "No pre-release tag snapshot; leaving all tags unchanged"
            exit 0
          fi
          git tag --list | LC_ALL=C sort > "$RUNNER_TEMP/tags-after-release.txt"
          while IFS= read -r tag; do
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            local_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
            if [[ "$local_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag ${tag} points at a different commit; preserving"
              continue
            fi
            package="$(node -p 'require("./package.json").name')"
            version="${tag#v}"
            npm_status="$(curl --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 -o "$RUNNER_TEMP/npm-rollback-version.json" -w '%{http_code}' "https://registry.npmjs.org/${package}/${version}")"
            if [[ "$npm_status" != 404 ]]; then
              echo "npm HTTP ${npm_status} for ${tag}: preserving tag"
              continue
            fi
            release_status="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 -o "$RUNNER_TEMP/github-rollback-release.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
            if [[ "$release_status" != 404 ]]; then
              echo "GitHub Release status ${release_status} for ${tag}: preserving"
              continue
            fi
            remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
              echo "Remote tag ${tag} moved or disappeared; preserving"
              continue
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            git tag -d "$tag"
            echo "::notice::Rolled back newly created unpublished tag ${tag} at ${GITHUB_SHA}"
          done < <(comm -13 "$RUNNER_TEMP/tags-before-release.txt" "$RUNNER_TEMP/tags-after-release.txt")
