version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'bot'
    ignore:
      # ESLint 10 introduced breaking config format changes — stick with 9.x
      - dependency-name: 'eslint'
        versions: ['>=10']
      # n8n-core 2.x is incompatible with peerDep "n8n-core >=1.14.0"
      - dependency-name: 'n8n-core'
        versions: ['>=2']
      # globals 17+ changes API — stay on 16.x until migration is planned
      - dependency-name: 'globals'
        versions: ['>=17']
      # semantic-release 25 uses conventional-changelog-writer@8; preset v10 requires writer@9.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        versions: ['>=10.0.0']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'bot'
